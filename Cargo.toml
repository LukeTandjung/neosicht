[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# All zed deps and base-gpui must pin the SAME zed revision or cargo builds
# two incompatible gpui crates.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
gpui_macos = { git = "https://github.com/zed-industries/zed.git", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
base-gpui = { git = "https://github.com/LukeTandjung/base-gpui.git", rev = "ceb5153aa3ee561010b2b33c13af6793d56eddb6" }
theme = { path = "crates/theme" }
weather = { path = "crates/weather" }
music = { path = "crates/music" }
datetime = { path = "crates/datetime" }
notifications = { path = "crates/notifications" }
volume = { path = "crates/volume" }
bluetooth = { path = "crates/bluetooth" }
wifi = { path = "crates/wifi" }
battery = { path = "crates/battery" }
wallpaper = { path = "crates/wallpaper" }

[package]
name = "weather"
version = "0.1.0"
edition = "2024"
publish = false
build = "src/adapters/core_location_build.rs"

[dependencies]
chrono = "0.4"
gpui = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
theme = { workspace = true }

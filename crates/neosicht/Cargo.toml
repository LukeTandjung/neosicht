[package]
name = "neosicht"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
core-foundation = "0.10"
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git" }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Nix apple-sdk xcrun cannot drive Xcode's downloadable Metal toolchain.
gpui_macos = { git = "https://github.com/zed-industries/zed.git", features = ["runtime_shaders"] }

[build-dependencies]
cc = "1"

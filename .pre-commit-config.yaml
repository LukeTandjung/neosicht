fail_fast: true

repos:
  - repo: local
    hooks:
      - id: project-check
        name: project checks
        entry: devenv tasks run project:check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ast-grep
        name: ast-grep scan
        entry: ast-grep scan --report-style short
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: commit-msg-format
        name: conventional commit message
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
